[package]
name = "room237-native-core"
version = "7.0.0"
description = "Room237 core process: library indexing, metadata, thumbnails, duplicates and updates"
license = "AGPL-3.0-only"
repository = "https://github.com/hikariatama/room237"
publish = false
edition = "2021"
rust-version = "1.90"

[lib]
name = "room237_native_core"

[features]
# QA hooks for qt/tests (ROOM237_QA_PORT/ROOM237_QA_FENCE). Debug builds have them without the feature.
qa = []

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "functions", "hooks"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
ffmpeg-sidecar = { version = "2.0.0", default-features = false }
chrono = "0.4.41"
rayon = "1.10"
exif = { package = "kamadak-exif", version = "0.6" }
once_cell = "1.21.3"
tokio = { version = "1.47.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1.0.98"
tempfile = "3"
img_hash = "3.2.0"
libwebp-sys = "0.14"
image = { version = "0.23.14", default-features = false, features = ["jpeg", "png", "webp"] }
hex = "0.4.3"
sha2 = "0.10.9"
libc = "0.2"
base64 = "0.22.1"
url = "2.5"
minisign-verify = "0.2"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_family = "unix")'.dependencies]
xattr = "1.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"
wl-clipboard-rs = "0.9"

[[bin]]
name = "room237-core"
path = "src/main.rs"
